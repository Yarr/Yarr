# Concept DOI: https://doi.org/10.5281/zenodo.15007378
#
# To add a new author: append an entry to the authors list below.
# To update affiliations or ORCIDs: edit the relevant entry.
# The CI will flag git contributors whose names do not match any entry here.
# Add git_names aliases if someone commits under a different name than their
# formal publication name.

metadata:
  title: "Yarr (Yet Another Rapid Readout)"
  description: |
    <p>Yet Another Rapid Readout (Yarr) software package contains calibration
    and data taking applications to operate and perform data acquisition on
    ATLAS Inner Tracker (ITk) Pixel and Strip modules. This framework supports
    characterization, quality control measurements, system testing and test beam
    operations. The framework provides an abstraction layer between the hardware
    interface (DAQ card) and the detector front-end modules, allowing a unified
    codebase to work with multiple hardware controllers (Spec, FELIX, emulators)
    and front-end ASICs (RD53B/ITkPixV2, RD53A, FEI4, Star/ABC).</p>
  license: "gpl-2.0"
  keywords:
    - ATLAS
    - ITk
    - pixel detector
    - strip detector
    - data acquisition
    - DAQ
    - YARR
    - CERN
    - RD53
  communities:
    - identifier: "atlas-experiment"

