job_test_pixel-on-hardware-eye-diagram:
  extends: .test
  tags:
    - scipp
  variables:
    TEST_STAND: "scipp"
  resource_group: hardware-$TEST_STAND
  needs:
    - job: job_build_all
      parallel:
        matrix:
          - ARCH: ['alma9']
  when: manual
  script:
    # list runner IDs
    - echo "TEST_STAND = $TEST_STAND"
    - echo "CI_RUNNER_ID = $CI_RUNNER_ID"
    - echo "CI_RUNNER_DESCRIPTION = $CI_RUNNER_DESCRIPTION"
    - echo "CI_RUNNER_TAGS = $CI_RUNNER_TAGS"
    # Clone the test data repo
    - echo "Fetching test data..."
    - git clone https://gitlab.cern.ch/YARR/utilities/yarr-ci-test-data.git test-data
    # Check that the test data is correct
    - ls test-data
    # Run eye diagram
    - echo "Run Eye Diagram..."
    - pwd
    - ./bin/eyeDiagram -r ./configs/controller/specCfg-rd53b-16x1.json -c ./test-data/$TEST_STAND/ci-module/connectivity.json | tee test-data/eye_output.log
    - echo "Checking for valid delay settings for lanes 0-3..."
    - |
      if [ $(grep -E "Delay setting for lane [0-3]" test-data/eye_output.log | wc -l) -ge 4 ]; then
        echo "Success!"
      else
        echo "Failure...less than 4 valid delay settings"
        exit 1
      fi
  artifacts:
    paths:
      - ./test-data
    expire_in: 1 day

job_test_pixel-on-hardware-digital-scan:
  extends: .test
  variables:
    TEST_STAND: "scipp"
  resource_group: hardware-$TEST_STAND
  tags:
    - scipp
  needs:
    - job: job_build_all
      parallel:
        matrix:
          - ARCH: ['alma9']
    - job: job_test_pixel-on-hardware-eye-diagram
      artifacts: true
  script:
    # keep yarr scan number deterministic
    - truncate $HOME/.yarr/runCounter --size=0
    # Run Digital Scan
    - echo "Run Digital Scan..."
    - pwd
    - mkdir -p ./outputs/digital-scan
    - ./bin/scanConsole -r ./configs/controller/specCfg-rd53b-16x1.json -c ./test-data/$TEST_STAND/ci-module/connectivity.json -o ./outputs/digital-scan -s ./configs/scans/itkpixv2/std_digitalscan.json -p
  artifacts:
    paths:
      - ./outputs/digital-scan
    expire_in: 1 month

