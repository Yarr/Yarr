---
stages:
  - build
  - package
  - tag
  - test
  - deploy

# If the pipeline is triggered by:
#    A merge request, run a merge request pipeline. For example, a merge request pipeline can be triggered by a push to a branch with an associated open merge request.
#    A change to a branch, but a merge request is open for that branch, do not run a branch pipeline.
#    A change to a branch, but without any open merge requests, run a branch pipeline.

.rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
.tag:
  stage: tag
  image: gitlab-registry.cern.ch/ci-tools/docker-builder/tools
  variables:
    GIT_STRATEGY: none
  dependencies: []

# common build definitions
image: gitlab-registry.cern.ch/yarr/yarr_container:yarr_alma9_build
.build:
  stage: build
  extends: .rules

.build_matrix:
  extends: .build
  image: gitlab-registry.cern.ch/yarr/yarr_container:yarr_${ARCH}_build
  parallel:
    matrix:
      - ARCH: ['alma9']
.test:
  stage: test
  extends: .rules

.deploy:
  stage: deploy

###############
# Build Stage #
###############

job_build_all:
  extends: .build_matrix
  artifacts:
    paths:
      - bin
      - lib
      - python
  before_script:
    - git config --global user.email "ci@example.com"
    - git config --global user.name "CI Runner"
  script:
    - source scl_source enable devtoolset-9 || echo ignoring exit code so CI does not bomb when it should not > /dev/null
    - dnf -y install autoconf automake libtool
    - mkdir  build
    - cd build
    - cmake3 .. -DBUILD_TESTS=on -DCMAKE_TOOLCHAIN_FILE=../cmake/linux-gcc -DYARR_CONTROLLERS_TO_BUILD=all -DYARR_FRONT_ENDS_TO_BUILD=all -DYARR_ACTIVE_LOGGER_LEVEL=TRACE -DYARR_ENABLE_PYTHON=on
    - make install -j$(nproc)
    - CTEST_OUTPUT_ON_FAILURE=1 make test
    - cd ..
    - bin/scanConsole -k
    - bin/scanConsole --version

job_build_all_most_modern:
  extends: .build_matrix
  before_script:
    - git config --global user.email "ci@example.com"
    - git config --global user.name "CI Runner"
  script:
    - dnf -y install gcc-toolset-15.x86_64 gcc-toolset-15-gcc.x86_64 cmake make boost-devel
    - source /opt/rh/gcc-toolset-15/enable
    - mkdir build
    - cd build
    - cmake3 .. -DBUILD_TESTS=on -DCMAKE_TOOLCHAIN_FILE=../cmake/linux-gcc -DYARR_CONTROLLERS_TO_BUILD="all" -DYARR_FRONT_ENDS_TO_BUILD="all" -DYARR_ACTIVE_LOGGER_LEVEL=TRACE -DYARR_ENABLE_PYTHON=on -DCMAKE_CXX_STANDARD=23
    - make install -j$(nproc)
    - CTEST_OUTPUT_ON_FAILURE=1 make test
    - cd ..
    - bin/scanConsole -k
    - bin/scanConsole --version

.out_of_source_base:
  extends: .build_matrix
  stage: build
  before_script:
    - dnf -y install gcc-toolset-15.x86_64 gcc-toolset-15-gcc.x86_64 cmake make boost-devel
    - source /opt/rh/gcc-toolset-15/enable
    - cmake3 --version
    - export YARR_PROJECT_DIR="$CI_PROJECT_DIR"
    - export YARR_TOOLCHAIN_FILE="$YARR_PROJECT_DIR/cmake/linux-gcc"
    - export YARR_WORK_DIR="$CI_BUILDS_DIR/work"
    - mkdir -p "$YARR_WORK_DIR"

job_test_find_package_consumer:
  extends: .out_of_source_base
  script:
    - export YARR_BUILD_DIR="$YARR_WORK_DIR/build-yarr"
    - echo "YARR build directory $YARR_BUILD_DIR"
    - export YARR_INSTALL_DIR="$YARR_WORK_DIR/install-yarr"
    - echo "YARR install directory $YARR_INSTALL_DIR"
    - cmake3 -S "$YARR_PROJECT_DIR" -B "$YARR_BUILD_DIR" -DBUILD_TESTS=on -DCMAKE_TOOLCHAIN_FILE="$YARR_TOOLCHAIN_FILE" -DCMAKE_INSTALL_PREFIX="$YARR_INSTALL_DIR" -DYARR_CONTROLLERS_TO_BUILD="all" -DYARR_FRONT_ENDS_TO_BUILD="all" -DYARR_ACTIVE_LOGGER_LEVEL=TRACE -DYARR_ENABLE_PYTHON=on -DCMAKE_CXX_STANDARD=20
    - cmake3 --build "$YARR_BUILD_DIR" --parallel "$(nproc)"
    - cmake3 --install "$YARR_BUILD_DIR"
    - export Yarr_DIR="$YARR_INSTALL_DIR/cmake/Yarr"
    - ctest --output-on-failure -j"$(nproc)" --test-dir "$YARR_BUILD_DIR"
    - $YARR_INSTALL_DIR/bin/scanConsole -k
    - export TEST_BUILD_DIR="$YARR_WORK_DIR/build-YarrFindPackageTest"
    - export TEST_INSTALL_DIR="$YARR_WORK_DIR/install-YarrFindPackageTest"
    - cmake3 -S "$YARR_PROJECT_DIR/tests/find_package_test" -B "$TEST_BUILD_DIR" -DCMAKE_TOOLCHAIN_FILE="$YARR_TOOLCHAIN_FILE" -DCMAKE_INSTALL_PREFIX="$TEST_INSTALL_DIR" -DYarr_DIR=$Yarr_DIR -Dfelix-interface_DIR="/builds/work/install-yarr/lib/cmake/felix-interface" -Dfelix-client-thread_DIR="/builds/work/install-yarr/lib/cmake/felix-client-thread"
    - cmake3 --build "$TEST_BUILD_DIR" --parallel "$(nproc)"
    - cmake3 --install "$TEST_BUILD_DIR"
    - $TEST_INSTALL_DIR/bin/YarrFindPackageTest

job_test_add_subdirectory_consumer:
  extends: .out_of_source_base
  script:
    - export BUILD_DIR="$YARR_WORK_DIR/build-YarrAddSubdirectoryTest"
    - export INSTALL_DIR="$YARR_WORK_DIR/install-YarrAddSubdirectoryTest"
    - cmake3 -S "$YARR_PROJECT_DIR/tests/add_subdirectory_test" -B "$BUILD_DIR" -DCMAKE_TOOLCHAIN_FILE="$YARR_TOOLCHAIN_FILE" -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" -DYARR_CONTROLLERS_TO_BUILD="all" -DYARR_FRONT_ENDS_TO_BUILD="all" -DYARR_ACTIVE_LOGGER_LEVEL=TRACE -DYARR_ENABLE_PYTHON=on -DCMAKE_CXX_STANDARD=20
    - cmake3 --build "$BUILD_DIR" --parallel "$(nproc)"
    - cmake3 --install "$BUILD_DIR"
    - $INSTALL_DIR/bin/YarrAddSubdirectoryTest

job_test_external_project_consumer:
  extends: .out_of_source_base
  script:
    - export BUILD_DIR="$YARR_WORK_DIR/build-YarrExternalSuperbuildTest"
    - export INSTALL_DIR="$YARR_WORK_DIR/install-YarrExternalSuperbuildTest"
    - cmake3 -S "$YARR_PROJECT_DIR/tests/external_project_superbuild_test" -B "$BUILD_DIR" -DCMAKE_TOOLCHAIN_FILE="$YARR_TOOLCHAIN_FILE" -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" -DYARR_PROJECT_DIR="$CI_PROJECT_DIR"
    - cmake3 --build "$BUILD_DIR" --parallel "$(nproc)"
    - cmake3 --install "$BUILD_DIR"
    - $INSTALL_DIR/bin/YarrConsumerTest

job_test_fetch_content_consumer:
  extends: .out_of_source_base
  script:
    - export BUILD_DIR="$YARR_WORK_DIR/build-YarrFetchContentTest"
    - export INSTALL_DIR="$YARR_WORK_DIR/install-YarrFetchContentTest"
    - cmake3 -S "$YARR_PROJECT_DIR/tests/fetch_content_test" -B "$BUILD_DIR" -DCMAKE_TOOLCHAIN_FILE="$YARR_TOOLCHAIN_FILE" -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" -DYARR_PROJECT_DIR="$YARR_PROJECT_DIR" -DYARR_CONTROLLERS_TO_BUILD="all" -DYARR_FRONT_ENDS_TO_BUILD="all" -DYARR_ACTIVE_LOGGER_LEVEL=TRACE -DYARR_ENABLE_PYTHON=on -DCMAKE_CXX_STANDARD=20
    - cmake3 --build "$BUILD_DIR" --parallel "$(nproc)"
    - cmake3 --install "$BUILD_DIR"
    - $INSTALL_DIR/bin/YarrFetchContentTest

job_build_clang:
  extends: .build_matrix
  stage: build
  script:
    - source scl_source enable devtoolset-9 || echo ignoring exit code so CI does not bomb when it should not > /dev/null
    - source scl_source enable llvm-toolset-11.0 || echo ignoring exit code so CI does not bomb when it should not > /dev/null
    - mkdir -p build
    - cd build
    - CXXFLAGS=-Werror cmake3 .. -DBUILD_TESTS=on -DCMAKE_TOOLCHAIN_FILE=../cmake/linux-clang
    - make install -k -j$(nproc)
    - CTEST_OUTPUT_ON_FAILURE=1 make test
    - cd ..
    - bin/scanConsole -k

job_build_none:
  extends: .build_matrix
  script:
    - source scl_source enable devtoolset-9 || echo ignoring exit code so CI does not bomb when it should not > /dev/null
    - mkdir build
    - cd build
    - cmake3 .. -DBUILD_TESTS=on -DCMAKE_TOOLCHAIN_FILE=../cmake/linux-gcc -DYARR_CONTROLLERS_TO_BUILD= -DYARR_FRONT_ENDS_TO_BUILD= -DYARR_ACTIVE_LOGGER_LEVEL=OFF
    - make install -j$(nproc)
    - CTEST_OUTPUT_ON_FAILURE=1 make test
    - cd ..
    - bin/scanConsole -k

# Run build with latest gcc and no other dependencies
job_build_test_gcc_15:
  extends: .rules
  stage: build
  image: registry.cern.ch/docker.io/library/gcc:15
  script:
    - apt-get update
    - apt-get install -y cmake make
    - mkdir build
    - cd build
    # Excluding bdaq as boost is missing
    # Excluding felix as required deps are are not present
    - export CONTROLLERS="Spec;Emu;StarEmu;Fei4Emu;Rd53aEmu;Itkpixv2Emu;ItsdaqFW"
    - cmake .. -DBUILD_TESTS=on -DCMAKE_TOOLCHAIN_FILE=../cmake/linux-gcc -DYARR_CONTROLLERS_TO_BUILD=${CONTROLLERS} -DYARR_FRONT_ENDS_TO_BUILD=all -DYARR_ACTIVE_LOGGER_LEVEL=OFF
    - make install -j$(nproc)
    - CTEST_OUTPUT_ON_FAILURE=1 make test
    - cd ..
    - bin/scanConsole -k

# Run build with oldest gcc and no other dependencies
job_build_test_gcc_9:
  extends: .rules
  stage: build
  image: registry.cern.ch/docker.io/library/gcc:9
  script:
    - apt-get update
    - apt-get install -y cmake make
    - mkdir build
    - cd build
    # Excluding bdaq as boost is missing
    # Excluding felix as required deps are are not present
    - export CONTROLLERS="Spec;Emu;StarEmu;Fei4Emu;Rd53aEmu;Itkpixv2Emu;ItsdaqFW"
    - cmake .. -DBUILD_TESTS=on -DCMAKE_TOOLCHAIN_FILE=../cmake/linux-gcc -DYARR_CONTROLLERS_TO_BUILD=${CONTROLLERS} -DYARR_FRONT_ENDS_TO_BUILD=all -DYARR_ACTIVE_LOGGER_LEVEL=OFF
    - make install -j$(nproc)
    - CTEST_OUTPUT_ON_FAILURE=1 make test
    - cd ..
    - bin/scanConsole -k

.build_felix:
  stage: build
  image: gitlab-registry.cern.ch/atlas-tdaq-felix/gitlab_ci_runner:el9-netboot-dev
  tags:
    - k8s-cvmfs
  artifacts:
    paths:
      - installed
  script:
    - git clone -b 5.2.x-ext https://gitlab.cern.ch/atlas-tdaq-felix/cmake_tdaq
    - source cmake_tdaq/bin/setup.sh
    - mkdir installed
    - cmake -S . -B build -DYARR_CONTROLLERS_TO_BUILD="Spec;Emu;StarEmu;Rd53aEmu;FelixClient" -DYARR_FRONT_ENDS_TO_BUILD="Rd53a;Star;Rd53b;Itkpixv2" -DDISABLE_PLOTTING_TOOLS=On -DYARR_EMULATORS_TO_BUILD="StarEmu;Rd53aEmu"  -DYARR_ENABLE_PYTHON=On  ..
    - cmake --build build -j$(nproc)
    - cmake --install build
    - cp -r Dockerfile bin lib64 python installed/

job_build_felix:
  extends: .build_felix
  only:
    - devel
    - tags

job_build_felix_check:
  extends: [.build_felix, .rules]
  # If build doesn't work for some reason it might make sense to ignore
  allow_failure: true

job_build_felix_release_52:
  extends: .rules
  stage: build
  image: gitlab-registry.cern.ch/atlas-tdaq-software/tdaq_ci:x86_64-el9
  tags:
    - cvmfs
  artifacts:
    paths:
      - installed
  variables:
    FELIX_PATH: /cvmfs/atlas-online-nightlies.cern.ch/felix/releases/felix-05-02-00-rm5-stand-alone/x86_64-el9-gcc15-opt
  script:
    - source /cvmfs/atlas.cern.ch/repo/sw/tdaq/tools/cmake_tdaq/bin/cm_setup.sh tdaq-12-03-00 x86_64-el9-gcc15-opt
    - gcc --version
    - cmake -B build -DFelix_ROOT=${FELIX_PATH} -DBUILD_TESTS=on -DYARR_CONTROLLERS_TO_BUILD=FelixClient -DYARR_FRONT_ENDS_TO_BUILD=Emu -DYARR_ENABLE_PYTHON=OFF -DCMAKE_CXX_STANDARD=20
    - cmake --build build -j$(nproc)
    - cmake --install build

.job_code_coverage:
  stage: build
  artifacts:
    paths:
      - cc_tests
  script:
    - date
    - source scl_source enable devtoolset-9 || echo ignoring exit code so CI does not bomb when it should not > /dev/null
    - mkdir  build
    - cd build
    - cmake3 .. -DBUILD_TESTS=on -DCMAKE_BUILD_TYPE=Coverage -DCMAKE_TOOLCHAIN_FILE=../cmake/linux-gcc
    - make install -j$(nproc)
    - /bin/pwd
    - cd ../
    - source scl_source enable devtoolset-9 || echo ignoring exit code so CI does not bomb when it should not > /dev/null
    - scripts/cc_tool.sh
  coverage: '/  lines......: \d+(?:\.\d+)?/'

job_code_coverage:
  extends: [".job_code_coverage", ".rules"]

job_code_coverage_deploy:
  extends: .job_code_coverage
  only:
    - devel
    - master

job_run_codechecker:
  stage: build
  timeout: 3 hours
  only:
    - merge_requests
  script:
    - source scl_source enable devtoolset-9 || echo ignoring exit code so CI does not bomb when it should not > /dev/null
    - source scl_source enable llvm-toolset-11.0 || echo ignoring exit code so CI does not bomb when it should not > /dev/null
    - scripts/run_codechecker.sh -j$(nproc)
  after_script:
    - cat gl-code-quality-report.json
  artifacts:
    paths:
      - checks
      - gl-code-quality-report.json
    reports:
      codequality: gl-code-quality-report.json

job_yamllint:
  extends: .build
  before_script:
    - pip install yamllint
  script:
    - yamllint .

.job_build_doxygen:
  stage: build
  before_script:
    - yum install -y doxygen graphviz
  script:
    - doxygen Doxyfile
  artifacts:
    paths:
      - doxygen/html

job_build_doxygen:
  extends: [".job_build_doxygen", ".rules"]

job_build_doxygen_deploy:
  extends: .job_build_doxygen
  only:
    - devel
    - master

.build_docs:
  stage: build
  before_script:
    - pip install mkdocs
  script:
    - export LC_ALL=en_US.utf-8
    - export LANG=en_US.utf-8
    - mkdocs build
  artifacts:
    paths:
      - site

build_docs:
  extends: [".build_docs", ".rules"]

build_docs_deploy:
  extends: .build_docs
  only:
    - devel
    - master

#################
# Package Stage #
#################

build_container:
  stage: package
  only:
    - devel
    - tags
  trigger:
    include:
      - project: 'ci-tools/docker-builder'
        file: '/ci.yml'
    strategy: depend
  variables:
    BUILD_AARCH64: "false"
    TO: "${CI_REGISTRY_IMAGE}"
    CONTEXT_DIR: installed
    DOCKER_FILE: installed//Dockerfile
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
    ARTIFACT_JOB: job_build_felix

###############
# Test Stage #
###############

job_test_pixel:
  extends: .test
  needs:
    - job: job_build_all
      parallel:
        matrix:
          - ARCH: ['alma9']
  script:
    - bin/scanConsole -r configs/controller/emuCfg.json -c configs/connectivity/example_fei4b_setup.json -s configs/scans/fei4/std_digitalscan.json -p -l configs/logging/trace_all.json
    - ls
    - ls ./data/
    - ls ./data/000001_std_digitalscan/
    - cat ./data/000001_std_digitalscan/*_OccupancyMap.json
    - NUM100=`cat ./data/000001_std_digitalscan/*_OccupancyMap.json | grep -o 100 | wc -l`
    - if ["$NUM100" != "26880"]; then exit 2; fi
    - bin/scanConsole  -r configs/controller/emuCfg_rd53a.json -c configs/connectivity/example_rd53a_setup.json -s configs/scans/rd53a/std_digitalscan.json
    - ls
    - ls ./data/
    - ls ./data/000002_std_digitalscan/
    - cat ./data/000002_std_digitalscan/*_OccupancyMap.json
    - NUM100=`cat ./data/000002_std_digitalscan/*_OccupancyMap.json | grep -o 100 | wc -l`
    - if ["$NUM100" != "76800"]; then exit 2; fi

job_test_pixel-on-hardware-berkeley-eye-diagram:
  extends: .test
  tags:
    - nakedsnail
  variables:
    TEST_STAND: "nakedsnail"
  resource_group: hardware-$TEST_STAND
  needs:
    - job: job_build_all
      parallel:
        matrix:
          - ARCH: ['alma9']
  when: manual
  script:
    # list runner IDs
    - echo "TEST_STAND = $TEST_STAND"
    - echo "CI_RUNNER_ID = $CI_RUNNER_ID"
    - echo "CI_RUNNER_DESCRIPTION = $CI_RUNNER_DESCRIPTION"
    - echo "CI_RUNNER_TAGS = $CI_RUNNER_TAGS"
    # set PS
    - /opt/local/pixel/labRemote/build/bin/powersupply -e /opt/local/pixel/input-hw-nakedsnail.json -n PS set-voltage 3
    - /opt/local/pixel/labRemote/build/bin/powersupply -e /opt/local/pixel/input-hw-nakedsnail.json -n PS set-current 6.5
    # power on PS
    - /opt/local/pixel/labRemote/build/bin/powersupply -e /opt/local/pixel/input-hw-nakedsnail.json -n PS power-on
    # Clone the test data repo
    - echo "Fetching test data..."
    - git clone https://gitlab.cern.ch/YARR/utilities/yarr-ci-test-data.git test-data
    # Check that the test data is correct
    - ls test-data
    # Run eye diagram
    - echo "Run Eye Diagram..."
    - pwd
    - ./bin/eyeDiagram -r ./test-data/$TEST_STAND/controller/specCfg-rd53b-16x1.json -c ./test-data/$TEST_STAND/ci-module/20UPIM13710116_L1_warm.json | tee test-data/eye_output.log
    - echo "Checking for valid delay settings for lanes 0-3..."
    - |
      if [ $(grep -E "Delay setting for lane [0-3]" test-data/eye_output.log | wc -l) -ge 4 ]; then
        echo "Success!"
      else
        echo "Failure...less than 4 valid delay settings"
        exit 1
      fi
    # power off PS
    - /opt/local/pixel/labRemote/build/bin/powersupply -e /opt/local/pixel/input-hw-nakedsnail.json -n PS power-off
  artifacts:
    paths:
      - ./test-data
    expire_in: 1 day

job_test_pixel-on-hardware-berkeley-digital-scan:
  extends: .test
  variables:
    TEST_STAND: "nakedsnail"
  resource_group: hardware-$TEST_STAND
  tags:
    - nakedsnail
  needs:
    - job: job_build_all
      parallel:
        matrix:
          - ARCH: ['alma9']
    - job: job_test_pixel-on-hardware-berkeley-eye-diagram
      artifacts: true
  script:
    # keep yarr scan number deterministic
    - truncate $HOME/.yarr/runCounter --size=0
    # set PS
    - /opt/local/pixel/labRemote/build/bin/powersupply -e /opt/local/pixel/input-hw-nakedsnail.json -n PS set-voltage 3
    - /opt/local/pixel/labRemote/build/bin/powersupply -e /opt/local/pixel/input-hw-nakedsnail.json -n PS set-current 6.5
    # power on PS
    - /opt/local/pixel/labRemote/build/bin/powersupply -e /opt/local/pixel/input-hw-nakedsnail.json -n PS power-on
    # Run Digital Scan
    - echo "Run Digital Scan..."
    - pwd
    - mkdir -p ./outputs/digital-scan
    - ./bin/scanConsole -r ./test-data/$TEST_STAND/controller/specCfg-rd53b-16x1.json -c ./test-data/$TEST_STAND/ci-module/20UPIM13710116_L1_warm.json -o ./outputs/digital-scan -s ./configs/scans/itkpixv2/std_digitalscan.json -p
    # power off PS
    - /opt/local/pixel/labRemote/build/bin/powersupply -e /opt/local/pixel/input-hw-nakedsnail.json -n PS power-off
  artifacts:
    paths:
      - ./outputs/digital-scan
    expire_in: 1 month

