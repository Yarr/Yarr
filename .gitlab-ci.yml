    "CI_OUTPUT_DIR": "cc_tests/"
  image: gitlab-registry.cern.ch/ci-tools/ci-web-deployer
  script:
    - deploy-eos

#############
# Tag Stage #
#############

tag_latest_devel_container:
  extends: .tag
  needs:
    - build_container
  script:
    - /kaniko/auth.sh
    - crane tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" "devel"
    - crane validate --remote "${CI_REGISTRY_IMAGE}:devel"
  only:
    - devel

tag_latest_release_container:
  extends: .tag
  needs:
    - build_container
  script:
    - /kaniko/auth.sh
    - crane tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_TAG}"
    - crane validate --remote "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
    - crane tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" "latest"
    - crane validate --remote "${CI_REGISTRY_IMAGE}:latest"
  only:
    - tags
